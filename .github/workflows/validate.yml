name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 所有 action 都钉到 commit SHA 而不是 tag。
# tag 是可变的（上游可随时把 v4 指到别的 commit），SHA 不是。
# 后面注释保留人类可读的版本号，方便升级时辨认。
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.4.0
      # persist-credentials: false —— 否则 token 会写进 .git/config，
      # 后续任何步骤（包括构建脚本、上传 artifact）都能读到它。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # cachix/install-nix-action@v27
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # 全部检查都在 nix develop 里跑，与本地完全同一条链路。
      # 没有第二套「CI 专用」命令 —— 那样迟早会漂移。
      - name: 全量验收
        run: nix develop --command ./scripts/check-all.sh

      # 产物作为 artifact，便于人工试装
      - name: 构建产物
        run: nix build .#rime-data --print-out-paths

      # actions/upload-artifact@v4.6.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cloudkeytao-rime-data
          path: result/
          retention-days: 14
